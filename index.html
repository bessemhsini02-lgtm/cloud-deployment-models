<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Deployment Models</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F2F5FA;--dots:#D3DBE9;--sf:#fff;--sf2:#F6F8FC;--fg:#0E1A33;--fg2:#445270;--line:#CBD4E4;--ac:#0A7FA3;--root:#0B1B3A;--tm:#E7EEFF;--tf:#1E40B0;
--d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--b:"IBM Plex Sans",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#08142B;--dots:#15264A;--sf:#10213F;--sf2:#0C1A35;--fg:#E8EEFB;--fg2:#A7B6D2;--line:#26406A;--ac:#22D3EE;--root:#14305F;--tm:#1B3262;--tf:#A9C6FF}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--b);display:flex;flex-direction:column;gap:10px;padding:12px 16px;box-sizing:border-box}
button{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
h1{margin:0;font:700 26px/1.05 var(--d);letter-spacing:-.015em}
.sub{color:var(--fg2);font-size:12.5px;margin-top:3px}
.nav,.tools{display:flex;flex-wrap:wrap;gap:6px}
.goal,.btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;font-size:12.5px;min-height:32px}
.btn{border-radius:8px;font-weight:500}
.goal i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.goal:hover,.btn:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#vp{position:relative;flex:1;min-height:340px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background-color:var(--bg);
background-image:radial-gradient(var(--dots) 1.2px,transparent 1.2px);background-size:24px 24px;touch-action:none;cursor:grab;user-select:none}
#stage{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#stage.an{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
#lk{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#lk path{fill:none;stroke-linecap:round}
.node{position:absolute;box-sizing:border-box;animation:pop .3s ease backwards}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.n0{background:var(--root);color:#fff;border-radius:22px;padding:22px;text-align:center;border:1.5px solid #22D3EE}
.n0 .k{font-size:11px;letter-spacing:.1em;opacity:.8}
.n0 .t0{font:700 38px/1.05 var(--d);margin:8px 0 10px}
.n0 .s{font-size:13px;color:#7FDDF2}
.dots{display:flex;justify-content:center;gap:8px;margin-top:14px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.n1{background:var(--c);color:#fff;border-radius:14px;padding:13px 16px;cursor:pointer}
.n1:hover{filter:brightness(1.1)}
.n1 .tag{font-size:12px;opacity:.9;margin-bottom:5px}
.n1 .ttl{font:700 23px/1.15 var(--d)}
.n1 .cnt{position:absolute;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--sf);color:var(--c);border:2px solid var(--c);display:grid;place-items:center;font:600 15px/1 var(--b);padding-bottom:1px}
.n2{background:var(--sf);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:11px;padding:11px 14px 12px}
.n2 .ttl{font:650 17px/1.25 var(--b);color:var(--c);margin-bottom:4px}
.n2 p{margin:4px 0 0;font-size:14px;color:var(--fg2)}
.n2 ul{margin:5px 0 0;padding-left:18px;font-size:14px}
.n2 li{margin:2px 0}
.t{font:.9em ui-monospace,Menlo,monospace;background:var(--tm);color:var(--tf);padding:0 .3em;border-radius:4px}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.flow span{background:var(--tm);color:var(--tf);border-radius:7px;padding:3px 9px;font-size:13px;font-weight:500}
.flow em{font-style:normal;color:var(--c);font-weight:700}
.st{margin-top:8px;padding:8px 11px;background:var(--sf2);border:1px solid var(--line);border-radius:8px;font-size:14px}
.st b{display:block;color:var(--c);font-size:14px}
.st small{display:block;color:var(--fg2);margin-top:2px}
table{border-collapse:collapse;width:100%;table-layout:fixed;margin-top:8px;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;overflow-wrap:normal}
thead th{color:#fff}
tbody th{background:var(--sf2);color:var(--c)}
.fin{background:var(--root);color:#fff;border-radius:10px;padding:9px 12px;margin-top:8px;font-weight:600;font-size:14px}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:2px;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:3px}
.zoom button{background:transparent;border:0;border-radius:7px;min-width:34px;height:32px;cursor:pointer;font-size:14px}
.zoom button:hover{background:var(--sf2)}
.zoom output{min-width:46px;text-align:center;font-size:12px;color:var(--fg2)}
.hint{position:absolute;left:14px;bottom:12px;margin:0;max-width:calc(100% - 300px);font-size:12px;color:var(--fg2);pointer-events:none}
@media(max-width:700px){.hint{display:none}h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){.node{animation:none}#stage.an{transition:none}}

.n0 .big{font-size:48px;line-height:1;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.dots i{width:32px;height:32px;display:grid;place-items:center;font-style:normal;font-size:16px}
.n1{box-shadow:0 10px 24px -10px var(--c);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 68%,#000))}
.n1 .ic{font-size:26px;margin-right:8px;vertical-align:-2px}
.n2{box-shadow:0 4px 14px -8px rgba(14,26,51,.35)}
.ic{margin-right:6px}
.flow span{background:var(--sf2);border:1.5px solid var(--c);border-top-width:4px;color:var(--fg);border-radius:10px;padding:5px 10px;text-align:center}
.pc li::marker{color:#17895a}.cc li::marker{color:#c0365f}
.pc .ttl{color:#17895a}.cc .ttl{color:#c0365f}
.bars{margin-top:8px;display:grid;gap:9px}
.bars b{font-size:13px;display:block;margin-bottom:3px}
.bars div div{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg2);margin:2px 0}
.bars i{display:block;height:9px;border-radius:5px;background:var(--m);width:var(--w)}
.bars span{min-width:68px}
#lk .dash{stroke-dasharray:2 9;animation:fw 1.2s linear infinite}
@keyframes fw{to{stroke-dashoffset:-22}}
@media(prefers-reduced-motion:reduce){.n0 .big,#lk .dash{animation:none}}
.i{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}
.n1 .ic .i{width:26px;height:26px}
.n0 .big{color:#7FDDF2}.n0 .big .i{width:54px;height:54px;stroke-width:1.5}
.dots i{color:#fff}
.flow .i{margin-right:5px;color:var(--c)}
.n2 .ttl .i{width:1.2em;height:1.2em}
.lg{width:30px;height:30px;border-radius:8px;background:#fff;color:#334;display:inline-grid;place-items:center;margin-right:8px;vertical-align:middle;border:1px solid var(--line);font:600 13px var(--b)}
.lg img{width:20px;height:20px}
.shot{display:block;width:100%;height:auto;margin-top:8px;border-radius:8px;border:1px solid var(--line);background:#fff}

{id:"b6",side:-1,c:"#B3365F",ic:"scale",tag:"Question du prof",t:"Critères de choix",kids:[
{t:"Sécurité et conformité",d:"Confidentialité, contrôle d’accès, isolation, chiffrement. Conformité : données médicales, bancaires, publiques, `data residency`. La sécurité dépend aussi de la configuration, pas seulement du modèle."},
{t:"Coût : CAPEX et OPEX",d:"`CAPEX` : achat de serveurs, stockage, réseau. `OPEX` : abonnements, énergie, maintenance, consommation. Public : OPEX et faible départ. Privé : CAPEX élevé. Communautaire : coûts partagés. Hybride : mélange. Raisonner en `TCO`."},
{t:"Élasticité et scalabilité",d:"`Scalability` : supporter plus de charge. `Elasticity` : ajuster les ressources à la hausse et à la baisse, vite. Exemple : un Black Friday demande dix fois plus de ressources que d’habitude."},

{t:"Disponibilité et performance",d:"Redondance, sauvegardes, `Disaster Recovery`, `SLA`. Latence : placer les ressources près des utilisateurs ou des équipements."},
{t:"Compétences et gestion",d:"Linux, virtualisation, réseau, stockage, sécurité, automatisation : un cloud privé demande beaucoup de compétences internes."},

{t:"Scénarios",ul:["Startup qui lance une application web → Public Cloud","Banque avec données très sensibles → Private Cloud","Plusieurs universités qui partagent leurs ressources de recherche → Community Cloud","Entreprise avec données critiques et trafic variable → Hybrid Cloud"]},
{t:"Question à la classe",d:"Le modèle le plus sécurisé est-il toujours le meilleur choix ? Non : il faut équilibrer sécurité, coût, performance, contrôle et besoins métier."},
{t:"Conclusion",fin:"Il n’existe pas de meilleur modèle de déploiement universel. Le bon choix dépend des besoins métier, de la sécurité, de la conformité, du budget, de la scalabilité et des compétences de l’organisation."}]},
